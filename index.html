<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <title>SHOK | Stylecard System</title>
  <style>
:root {
  --noir: #070707;
  --noir-soft: #10100f;
  --charcoal: #171716;
  --ivory: #eee9e2;
  --ivory-deep: #d9d1c9;
  --sheet: #c9c2c2;
  --ash: #8b857d;
  --line: #302e2b;
  --tomato: #cdb8ff;
  --tomato-dark: #9d83da;
  --warning: #e6dcff;
  --danger: #ff6b61;
  --text-main: var(--ivory);
  --text-muted: var(--ash);
  --border: var(--line);
  --mmc-green: var(--tomato);
  --mmc-red: var(--danger);
}

* {
  box-sizing: border-box;
}

html {
  color-scheme: dark;
  background: var(--noir);
}

body {
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  color: var(--ivory);
  background: var(--noir);
  font-family: 'DM Sans', Arial, sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

button,
a,
input,
select,
textarea {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--tomato);
  outline-offset: 3px;
}

::selection {
  color: var(--noir);
  background: var(--tomato);
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--noir);
}

::-webkit-scrollbar-thumb {
  background: #3b3834;
}

/* ==========================================================================
   PROFILE GATEWAY — FASHION EDITORIAL COVER
   ========================================================================== */

#profileScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  min-height: 100vh;
  display: grid;
  grid-template-rows: 78px minmax(0, 1fr) 54px;
  padding: 0 clamp(24px, 4vw, 68px);
  overflow: auto;
  background:
    linear-gradient(90deg, transparent calc(50% - .5px), rgba(240,235,226,.08) 50%, transparent calc(50% + .5px)),
    var(--noir);
  transition: opacity 0.6s ease;
}

.gateway-header,
.gateway-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}

.gateway-brand {
  display: flex;
  align-items: center;
  gap: 16px;
}

.gateway-brand strong {
  font-family: 'Bodoni Moda', serif;
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -.08em;
}

.gateway-brand span,
.gateway-edition,
.gateway-footer,
.gateway-kicker,
.profile-order,
.profile-open {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.gateway-brand span,
.gateway-edition {
  color: var(--ash);
}

.gateway-main {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(340px, .82fr) minmax(620px, 1.3fr);
  align-items: center;
  gap: clamp(40px, 6vw, 110px);
  padding: 38px 0;
}

.gateway-copy {
  position: relative;
  align-self: center;
}

.gateway-copy::before {
  content: "SHOK";
  position: absolute;
  top: -120px;
  left: -18px;
  z-index: -1;
  color: transparent;
  font-family: 'Bodoni Moda', serif;
  font-size: clamp(180px, 22vw, 340px);
  font-weight: 600;
  line-height: 1;
  -webkit-text-stroke: 1px rgba(240,235,226,.045);
  pointer-events: none;
}

.gateway-kicker {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: var(--tomato);
  letter-spacing: .04em;
  text-transform: none;
}

.gateway-kicker::before {
  content: "";
  width: 28px;
  height: 1px;
  background: currentColor;
}

.gateway-copy h1 {
  margin: 25px 0 18px;
  color: var(--ivory);
  font-family: 'Bodoni Moda', Georgia, serif;
  font-size: clamp(66px, 7.1vw, 112px);
  font-weight: 500;
  line-height: .78;
  letter-spacing: -.075em;
}

.gateway-copy h1 em {
  color: var(--tomato);
  font-weight: 500;
}

.gateway-copy p {
  margin: 0 0 0 42px;
  color: var(--ash);
  font-size: 12px;
}

.profiles-container {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(12px, 1.6vw, 26px);
  align-items: end;
}

.profile {
  position: relative;
  min-width: 0;
  cursor: pointer;
  transform: translateY(0);
  transition: transform .28s ease;
}

.profile:nth-child(2) {
  transform: translateY(-34px);
}

.profile:nth-child(2):hover {
  transform: translateY(-44px);
}

.profile:hover {
  transform: translateY(-10px);
}

.profile-order {
  display: block;
  margin-bottom: 9px;
  color: var(--ash);
}

.profile-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: .72;
  overflow: hidden;
  background: #1b1a19;
  border: 1px solid #3a3733;
}

.profile-img-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 10px solid transparent;
  transition: border-color .25s ease;
  pointer-events: none;
}

.profile:hover .profile-img-wrap::after {
  border-color: rgba(205,184,255,.78);
}

.profile img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  filter: grayscale(.3) contrast(1.04);
  transform: scale(1.01);
  transition: filter .3s ease, transform .5s ease;
}

.profile:hover img {
  filter: grayscale(0) contrast(1.03);
  transform: scale(1.045);
}

.profile-card-foot {
  min-height: 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 2px;
  border-bottom: 1px solid var(--line);
}

.profile-name-text {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--ivory);
  font-family: 'Bodoni Moda', serif;
  font-size: clamp(18px, 1.6vw, 25px);
  font-weight: 500;
  letter-spacing: -.035em;
}

.profile-open {
  color: var(--ash);
  white-space: nowrap;
  transition: color .2s ease;
}

.profile:hover .profile-open {
  color: var(--tomato);
}

.lock-icon {
  width: 13px;
  height: 13px;
  fill: currentColor;
}

.profile.loading img {
  opacity: .3;
}

.profile.loading .profile-img-wrap::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 4;
  width: 38px;
  height: 38px;
  margin: -19px 0 0 -19px;
  border: 2px solid rgba(240,235,226,.2);
  border-top-color: var(--tomato);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.gateway-footer {
  color: #56514c;
  border-top: 1px solid var(--line);
  border-bottom: 0;
}

/* ==========================================================================
   STYLECARD SYSTEM APP
   ========================================================================== */

#mainApp {
  width: 100%;
  min-height: 100vh;
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  background: var(--noir);
  transition: opacity .65s ease;
}

.atelier-shell {
  width: 100%;
  min-height: 100vh;
  display: grid;
  grid-template-rows: 100px minmax(0, 1fr);
}

.atelier-header {
  width: min(1420px, calc(100% - 48px));
  min-height: 64px;
  align-self: center;
  justify-self: center;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(9, 9, 9, .96);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .28);
}

.atelier-brand {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 44px;
  padding: 0 15px 0 9px;
}

.atelier-brand strong {
  color: var(--tomato);
  font-family: 'Bodoni Moda', serif;
  font-size: 33px;
  line-height: 1;
  letter-spacing: -.08em;
}

.atelier-brand span {
  color: var(--ivory);
  font: 500 9px/1.25 'IBM Plex Mono', monospace;
  letter-spacing: .09em;
}

.atelier-home-btn {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  display: grid;
  place-items: center;
  padding: 0;
  color: var(--tomato);
  background: #111110;
  border: 1px solid #35322f;
  border-radius: 50%;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
}

.atelier-home-btn:hover {
  color: var(--noir);
  background: var(--tomato);
  border-color: var(--tomato);
  transform: translateY(-2px);
}

.atelier-home-btn svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.atelier-menu {
  min-width: 0;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.atelier-menu button,
.atelier-menu a {
  min-width: 0;
  min-height: 38px;
  flex: 0 1 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 clamp(10px, 1vw, 15px);
  color: #d9d4cd;
  background: #111110;
  border: 1px solid #35322f;
  border-radius: 999px;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
}

.atelier-menu button:hover,
.atelier-menu a:hover,
.atelier-menu button.is-active {
  color: var(--noir);
  background: var(--tomato);
  border-color: var(--tomato);
  transform: translateY(-2px);
}

.sheet-step,
.sheet-command,
.sheet-footer,
.transform-label,
.atelier-actions,
.masthead-index {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.atelier-menu b {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  white-space: nowrap;
}

.atelier-tools {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 7px;
  padding-left: 12px;
  border-left: 1px solid var(--line);
}

.atelier-tools button {
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 11px;
  color: #d9d4cd;
  background: #111110;
  border: 1px solid #35322f;
  border-radius: 999px;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
}

.atelier-tools button:hover {
  color: var(--noir);
  background: var(--tomato);
  border-color: var(--tomato);
  transform: translateY(-2px);
}

.nav-icon {
  width: 17px;
  height: 17px;
  flex: 0 0 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--tomato);
}

.nav-icon svg {
  width: 17px;
  height: 17px;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.atelier-menu button:hover .nav-icon,
.atelier-menu a:hover .nav-icon,
.atelier-menu button.is-active .nav-icon,
.atelier-tools button:hover .nav-icon {
  color: var(--noir);
}

.nav-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}

.atelier-main {
  height: calc(100vh - 100px);
  min-height: 620px;
  display: grid;
  grid-template-rows: 132px minmax(0, 1fr);
  padding: 0 clamp(22px, 3.1vw, 50px) 32px;
  background:
    linear-gradient(90deg, rgba(240,235,226,.028) 1px, transparent 1px) 0 0 / 12.5% 100%,
    var(--noir);
}

.atelier-main[hidden] {
  display: none;
}

.atelier-masthead {
  display: flex;
  align-items: end;
  justify-content: center;
  padding: 4px 0 40px;
  border-bottom: 1px solid var(--line);
}

.atelier-masthead h1 {
  margin: 0;
  color: var(--ivory);
  font-family: 'Bodoni Moda', serif;
  font-size: clamp(48px, 5vw, 76px);
  font-weight: 500;
  line-height: .85;
  letter-spacing: -.065em;
  text-align: center;
}

.atelier-masthead h1 em {
  color: var(--tomato);
  font-weight: 500;
}

.atelier-workspace {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 184px minmax(0, 1fr);
  gap: 0;
  padding: 20px 0;
}

.editor-sheet {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: 67px minmax(0, 1fr) 32px;
  overflow: hidden;
  border: 1px solid var(--line);
}

.editor-sheet-input {
  color: #161412;
  background: var(--sheet);
  border-color: var(--sheet);
}

.editor-sheet-output {
  color: var(--ivory);
  background: #0e0e0d;
}

.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 19px;
  border-bottom: 1px solid currentColor;
}

.editor-sheet-input .sheet-header {
  border-bottom-color: rgba(22,20,18,.22);
}

.editor-sheet-output .sheet-header {
  border-bottom-color: var(--line);
}

.sheet-header > div {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.sheet-step {
  color: var(--tomato);
}

.sheet-header label {
  margin: 0;
  color: inherit;
  font-family: 'Bodoni Moda', serif;
  font-size: 22px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -.03em;
  text-transform: none;
}

.sheet-command {
  color: #7a736b;
}

.editor-sheet textarea {
  width: 100%;
  min-height: 0;
  padding: 20px;
  background: transparent;
  border: 0;
  border-radius: 0;
  outline: 0;
  font: 400 11px/1.72 'IBM Plex Mono', monospace;
  resize: none;
}

.editor-sheet-input textarea {
  color: #211e1a;
  caret-color: var(--tomato);
}

.editor-sheet-input textarea::placeholder {
  color: #9b9288;
}

.editor-sheet-output textarea {
  color: #d8d1c8;
  caret-color: var(--tomato);
}

.editor-sheet-output textarea::placeholder {
  color: #4d4944;
}

.editor-sheet textarea:focus {
  box-shadow: inset 4px 0 0 var(--tomato);
}

.sheet-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 0 17px;
}

.editor-sheet-input .sheet-footer {
  color: #827970;
  border-top: 1px solid rgba(22,20,18,.18);
}

.editor-sheet-output .sheet-footer {
  color: #5e5953;
  border-top: 1px solid var(--line);
}

.transform-column {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
}

.transform-column::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  background: var(--line);
}

.transform-label {
  z-index: 1;
  padding: 6px;
  color: #5d5852;
  background: var(--noir);
  writing-mode: vertical-rl;
}

.generate-orbit {
  position: relative;
  z-index: 2;
  width: 88px;
  height: 88px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--noir);
  background: var(--tomato);
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 0 10px var(--noir), 0 0 0 11px var(--line);
  transition: background .2s ease, transform .22s ease;
}

.generate-orbit:hover {
  background: var(--ivory);
  transform: rotate(-6deg) scale(1.06);
}

.generate-orbit span {
  max-width: 72px;
  font-size: 10px;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
  text-transform: uppercase;
}

.generate-orbit b {
  font-size: 18px;
  font-weight: 400;
}

.transform-typographic {
  position: relative;
  z-index: 2;
  width: 174px;
  display: flex;
  flex-direction: column;
  background: var(--noir);
}

.transform-step {
  width: 174px;
  min-height: 116px;
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  color: var(--ivory);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  text-align: left;
}

.transform-step:first-child {
  border-top: 1px solid var(--line);
}

.transform-step-number {
  color: var(--tomato);
  font-family: 'Bodoni Moda', serif;
  font-size: 43px;
  font-weight: 500;
  line-height: 1;
  transition: color .22s ease, transform .22s ease;
}

.transform-step-copy {
  min-width: 0;
}

.transform-step-copy b {
  display: block;
  color: var(--ivory);
  font-family: 'Bodoni Moda', serif;
  font-size: 20px;
  font-weight: 500;
  line-height: .95;
  letter-spacing: -.04em;
  transition: color .22s ease, transform .22s ease;
}

.transform-step-copy small {
  display: block;
  margin-top: 8px;
  overflow: hidden;
  color: #67615c;
  font: 600 7px/1.35 'IBM Plex Mono', monospace;
  letter-spacing: .08em;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
  transition: color .22s ease, transform .22s ease;
}

.transform-step:hover .transform-step-number {
  color: var(--ivory);
  transform: translateX(8px) rotate(-8deg);
}

.transform-step:hover .transform-step-copy b,
.transform-step:hover .transform-step-copy small {
  color: var(--tomato);
  transform: translateX(3px);
}

.transform-step:active {
  transform: translateY(1px);
}

.sheet-header > .sheet-header-actions {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.discord-send-btn {
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  color: var(--tomato);
  background: rgba(205, 184, 255, .045);
  border: 1px solid rgba(205, 184, 255, .36);
  font: 600 8px/1 'IBM Plex Mono', monospace;
  letter-spacing: .05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
}

.discord-send-btn[hidden] {
  display: none !important;
}

.discord-send-btn svg {
  width: 17px;
  height: 17px;
  flex: 0 0 17px;
  fill: currentColor;
}

.discord-send-btn:hover {
  color: var(--noir);
  background: var(--tomato);
  border-color: var(--tomato);
  transform: translateY(-1px);
}

.discord-name-label {
  width: 100%;
  display: block;
  margin: 5px 0 8px;
  color: var(--tomato);
  font: 600 8px/1.4 'IBM Plex Mono', monospace;
  letter-spacing: .09em;
  text-align: left;
  text-transform: uppercase;
}

.discord-name-label.is-second {
  margin-top: 16px;
}

.ignored-items-btn {
  display: inline-flex;
  align-items: center;
  gap: 0;
  padding: 0;
  color: var(--ash);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 0;
  font: 500 8px/1 'IBM Plex Mono', monospace;
  letter-spacing: .06em;
  text-transform: uppercase;
  cursor: pointer;
}

.ignored-items-btn > span:first-child {
  padding: 8px 9px;
}

.ignored-count {
  min-width: 28px;
  padding: 8px;
  color: var(--ivory);
  background: #211f1c;
  border-left: 1px solid var(--line);
  text-align: center;
}

.ignored-items-btn:hover,
.ignored-items-btn.has-items {
  color: var(--warning);
  border-color: #6f5128;
}

.ignored-items-btn.has-items .ignored-count {
  color: var(--noir);
  background: var(--warning);
}

.ignored-help-icon {
  display: none;
}

.atelier-actions {
  display: grid;
  grid-template-columns: 1fr 190px 190px;
  border: 1px solid var(--line);
}

.atelier-status {
  display: flex;
  align-items: center;

  border: 0;
  border-radius: 0;

    0 42px 110px rgba(0, 0, 0, .78);
  animation: modal-in .25s cubic-bezier(.2, .8, .2, 1);
  scrollbar-gutter: stable;
}

.modal::before {

}

}

}

  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 0 17px;
  color: var(--ash);
  background: #151414;
  border: 1px solid #353136;
  border-radius: 999px;
  font: 500 8px/1 'IBM Plex Mono', monospace;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.store-count-badge strong {
  color: var(--tomato);
  font-size: 11px;
}

.store-page-action,
.store-save-btn {
  min-height: 46px;
  padding: 0 18px;
  border-radius: 999px;
  font: 600 8px/1 'IBM Plex Mono', monospace;
  letter-spacing: .07em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
}

.store-page-action {
  color: var(--ivory);
  background: #191818;
  border: 1px solid #403b3e;
}

.store-page-action:hover {
  color: var(--noir);
  background: var(--tomato);
  border-color: var(--tomato);
  transform: translateY(-2px);
}

.store-page-action.is-danger {
  color: var(--danger);
  background: rgba(255,107,97,.055);
  border-color: rgba(255,107,97,.3);
}

.store-page-action.is-danger:hover {
  color: var(--noir);
  background: var(--danger);
  border-color: var(--danger);
}

.stores-page .store-grid {
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px;
  min-height: 310px;
  margin: 0;
  padding: 24px;
  overflow: visible;
}

.stores-page .store-card {
  position: relative;
  min-height: 112px;
  align-items: stretch;
  padding: 17px;
  overflow: hidden;
  background: #151414;
  border-color: #353136;
  border-radius: 16px;
}

.stores-page .store-card::after {
  content: attr(data-index);
  position: absolute;
  right: -4px;
  bottom: -20px;
  color: rgba(205, 184, 255, .04);
  font-family: 'Bodoni Moda', serif;
  font-size: 92px;
  line-height: 1;
  pointer-events: none;
}

.stores-page .store-name-container {
  position: relative;
  z-index: 1;
  justify-content: space-between;
}

.stores-page .store-name {
  max-width: 100%;
  overflow: hidden;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.store-card-details {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 7px;
  margin-top: 12px;
}

.store-slurl {
  max-width: 100%;
  overflow: hidden;
  color: #6f6964;
  font: 500 8px/1.35 'IBM Plex Mono', monospace;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.stores-page .mini-tag {
  margin-top: 0;
}

.stores-page .store-delete {
  position: relative;
  z-index: 2;
  width: 32px;
  height: 32px;
  margin: -4px -4px 0 10px;
  padding: 8px;
  background: #1c1a1a;
  border: 1px solid #3b3739;
  border-radius: 50%;
}

.store-page-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 52px;
  padding: 0 24px;
  color: #5f5954;
  background: #10100f;
  border-top: 1px solid #302d30;
  font: 500 8px/1.4 'IBM Plex Mono', monospace;
  letter-spacing: .07em;
  text-transform: uppercase;
}

.store-no-results {
  margin: 0 24px 24px;
  padding: 34px 20px;
  color: var(--ash);
  background: #131212;
  border: 1px dashed #3b373a;
  border-radius: 15px;
  font: 500 9px/1.5 'IBM Plex Mono', monospace;
  letter-spacing: .06em;
  text-align: center;
  text-transform: uppercase;
}

.store-no-results[hidden] {
  display: none;
}

/* STORE ARCHIVE — SPLIT VIEW */
.store-archive-browser {
  min-height: 430px;
  display: grid;
  grid-template-columns: minmax(280px, .68fr) minmax(440px, 1.35fr);
  padding: 0 24px;
}

.stores-page .store-grid.store-archive-list {
  min-height: 430px;
  max-height: 520px;
  display: block;
  margin: 0;
  padding: 0 24px 0 0;
  overflow-x: hidden;
  overflow-y: auto;
  border-right: 1px solid #302d30;
}

.store-archive-list .store-card,
.stores-page .store-archive-list .store-card {
  width: 100%;
  min-height: 66px;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  gap: 13px;
  align-items: center;
  margin: 0;
  padding: 14px 8px 14px 0;
  overflow: visible;
  color: var(--ash);
  background: transparent;
  border: 0;
  border-bottom: 1px solid rgba(48, 45, 48, .82);
  border-radius: 0;
  cursor: pointer;
  text-align: left;
  transform: none;
}

.store-archive-list .store-card:hover,
.store-archive-list .store-card.is-selected,
.stores-page .store-archive-list .store-card:hover {
  color: var(--ivory);
  background: transparent;
  border-color: rgba(205, 184, 255, .32);
  transform: none;
}

.stores-page .store-archive-list .store-card::after {
  display: none;
}

.store-list-order {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #706a64;
  background: #1b191a;
  font: 600 8px/1 'IBM Plex Mono', monospace;
  transition: color .2s ease, background .2s ease;
}

.store-card.is-selected .store-list-order {
  color: var(--noir);
  background: var(--tomato);
}

.store-list-name {
  min-width: 0;
  overflow: hidden;
  color: inherit;
  font-size: 12px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.store-list-arrow {
  color: #5f5954;
  font-size: 16px;
  transition: color .2s ease, transform .2s ease;
}

.store-card:hover .store-list-arrow,
.store-card.is-selected .store-list-arrow {
  color: var(--tomato);
  transform: translateX(3px);
}

.store-detail-panel {
  position: relative;
  min-width: 0;
  min-height: 430px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(34px, 4vw, 58px);
  overflow: hidden;
}

.store-detail-panel::after {
  content: attr(data-letter);
  position: absolute;
  right: -18px;
  bottom: -100px;
  z-index: 0;
  color: transparent;
  font-family: 'Bodoni Moda', serif;
  font-size: clamp(230px, 20vw, 310px);
  font-weight: 600;
  line-height: 1;
  -webkit-text-stroke: 1px rgba(205, 184, 255, .1);
  pointer-events: none;
}

.store-detail-panel > * {
  position: relative;
  z-index: 1;
}

.store-detail-label,
.store-detail-address-label {
  display: block;
  color: var(--tomato);
  font: 600 8px/1.4 'IBM Plex Mono', monospace;
  letter-spacing: .11em;
  text-transform: uppercase;
}

.store-detail-label {
  margin-bottom: 26px;
}

.store-detail-name {
  max-width: 760px;
  margin: 0 0 22px;
  color: var(--ivory);
  font-family: 'Bodoni Moda', serif;
  font-size: clamp(54px, 6vw, 88px);
  font-weight: 500;
  line-height: .84;
  letter-spacing: -.065em;
  overflow-wrap: anywhere;
}

.store-detail-tag {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 10px;
  color: var(--tomato);
  border: 1px solid rgba(205, 184, 255, .46);
  border-radius: 999px;
  font: 600 8px/1 'IBM Plex Mono', monospace;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.store-detail-bottom {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 28px;
  align-items: end;
}

.store-detail-address-label {
  margin-bottom: 10px;
  color: #6d6660;
}

.store-detail-slurl {
  max-width: 580px;
  margin: 0;
  color: var(--ash);
  font: 500 10px/1.65 'IBM Plex Mono', monospace;
  overflow-wrap: anywhere;
}

.store-detail-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 9px;
}

.store-detail-btn {
  min-height: 44px;
  padding: 0 18px;
  color: var(--ivory);
  background: transparent;
  border: 1px solid #403b3e;
  border-radius: 999px;
  font: 600 8px/1 'IBM Plex Mono', monospace;
  letter-spacing: .07em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
}

.store-detail-btn:hover {
  color: var(--noir);
  background: var(--tomato);
  border-color: var(--tomato);
  transform: translateY(-2px);
}

.store-detail-btn.is-danger {
  color: var(--danger);
  border-color: rgba(255, 107, 97, .35);
}

.store-detail-btn.is-danger:hover {
  color: var(--noir);
  background: var(--danger);
  border-color: var(--danger);
}

.store-detail-btn.is-primary {
  color: var(--noir);
  background: var(--tomato);
  border-color: var(--tomato);
}

.store-detail-btn.is-primary:hover {
  background: var(--ivory);
  border-color: var(--ivory);
}

.store-detail-btn:disabled {
  opacity: .34;
  cursor: not-allowed;
  transform: none;
}

.store-archive-browser.is-loading .store-archive-list {
  grid-column: 1 / -1;
  min-height: 430px;
  max-height: none;
  display: grid;
  place-items: center;
  padding: 0;
  border-right: 0;
}

.store-archive-browser.is-loading .store-detail-panel {
  display: none;
}

.store-archive-browser.is-empty .store-archive-list {
  grid-column: 1 / -1;
  min-height: 330px;
  max-height: none;
  display: grid;
  place-items: center;
  padding: 0;
  border-right: 0;
}

.store-archive-browser.is-empty .store-detail-panel {
  display: none;
}

.store-archive-list .store-grid-loading {
  min-height: 120px;
  display: grid;
  place-items: center;
  color: var(--ash);
  font: 500 9px/1.5 'IBM Plex Mono', monospace;
  letter-spacing: .06em;
  text-align: center;
  text-transform: uppercase;
}

.store-add-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr);
  min-height: 410px;
}

.store-add-main,
.store-add-aside {
  padding: 28px;
}

.store-add-main {
  border-right: 1px solid #302d30;
}

.store-form-label {
  display: block;
  margin-bottom: 10px;
  color: var(--tomato);
  font: 500 8px/1 'IBM Plex Mono', monospace;
  letter-spacing: .11em;
  text-transform: uppercase;
}

.store-form-title {
  margin: 0 0 22px;
  color: var(--ivory);
  font-family: 'Bodoni Moda', serif;
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -.04em;
}

.store-add-main textarea {
  width: 100%;
  min-height: 290px;
  resize: vertical;
  padding: 20px;
  color: var(--ivory);
  background: #151414;
  border: 1px solid #3a3639;
  border-radius: 16px;
  outline: 0;
  font: 500 11px/1.65 'IBM Plex Mono', monospace;
  transition: background .18s ease, border-color .18s ease;
}

.store-add-main textarea:focus {
  background: rgba(205, 184, 255, .045);
  border-color: var(--tomato);
}

.store-add-main textarea::placeholder {
  color: #67615d;
}

.store-add-aside {
  display: flex;
  flex-direction: column;
  gap: 24px;
  background: #111110;
}

.store-format-card {
  padding: 18px;
  background: #171616;
  border: 1px solid #353136;
  border-radius: 15px;
}

.store-format-card small {
  display: block;
  margin-bottom: 10px;
  color: var(--tomato);
  font: 500 8px/1 'IBM Plex Mono', monospace;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.store-format-card code {
  color: var(--ivory);
  font: 500 10px/1.7 'IBM Plex Mono', monospace;
  white-space: normal;
}

.store-format-card p {
  margin: 12px 0 0;
  color: var(--ash);
  font-size: 11px;
  line-height: 1.55;
}

.store-select-wrap label {
  display: block;
  margin-bottom: 9px;
  color: var(--ash);
  font: 500 8px/1 'IBM Plex Mono', monospace;
  letter-spacing: .09em;
  text-transform: uppercase;
}

.store-select-wrap select {
  width: 100%;
  min-height: 50px;
  padding: 0 14px;
  color: var(--ivory);
  background: #171616;
  border: 1px solid #3a3639;
  border-radius: 13px;
  outline: 0;
  font-size: 11px;
}

.store-add-actionbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 82px;
  padding: 14px 20px 14px 28px;
  background: #10100f;
  border-top: 1px solid #302d30;
}

.store-add-actionbar span {
  color: #625c57;
  font: 500 8px/1.5 'IBM Plex Mono', monospace;
  letter-spacing: .07em;
  text-transform: uppercase;
}

.store-save-btn {
  min-width: 170px;
  color: var(--noir);
  background: var(--tomato);
  border: 1px solid var(--tomato);
}

.store-save-btn:hover {
  background: #ded0ff;
  border-color: #ded0ff;
  transform: translateY(-2px);
}

.btn:disabled {
  color: #68625e !important;
  background: #171616 !important;
  border-color: #302d2d !important;
  transform: none !important;
  cursor: not-allowed;
  opacity: .72;
}

.help-list {
  margin: 0;
  padding-left: 22px;
  color: #aaa29a;
  font-size: 14px;
  line-height: 1.82;
}

.help-list li {
  margin-bottom: 10px;
}

.help-list b {
  color: var(--ivory);
}

.modal-info-card {
  width: 100%;
  padding: 23px 5px;
  background: transparent;
  border: 0;
  border-top: 1px solid #332e37;
  border-bottom: 1px solid #332e37;
  border-radius: 0;
  box-shadow: none;
}

.ignored-list {
  width: 100%;
  max-height: 55vh;
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow-y: auto;
  border-top: 1px solid #332e37;
}

.ignored-card {
  position: relative;
  padding: 17px 6px 17px 22px;
  background: transparent;
  border: 0;
  border-bottom: 1px solid #332e37;
  border-radius: 0;
}

.ignored-card::before {
  content: "";
  position: absolute;
  top: 19px;
  bottom: 19px;
  left: 0;
  width: 1px;
  background: var(--tomato);
}

.ignored-reason {
  margin-bottom: 7px;
  color: var(--tomato);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}

.ignored-product {
  color: var(--ivory);
  font: 13px/1.55 'IBM Plex Mono', monospace;
  overflow-wrap: anywhere;
}

.learn-correction-line {
  margin-top: 8px;
  color: var(--tomato);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.processing-summary-modal {
  width: min(900px, calc(100vw - 36px));
  padding: 58px 42px 34px;
}

.processing-summary-modal h3 {
  margin-bottom: 11px;
  font-size: clamp(38px, 5vw, 52px);
}

.processing-summary-modal > p {
  margin-bottom: 24px;
}

.processing-summary-overview {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px 0;
  margin: 0 0 22px;
  padding: 14px 18px;
  background: rgba(205, 184, 255, .035);
  border-top: 1px solid #353039;
  border-bottom: 1px solid #353039;
}

.processing-summary-overview[hidden] {
  display: none;
}

.processing-summary-overview > strong {
  color: var(--ivory);
  font-size: 13px;
  font-weight: 750;
}

.processing-summary-overview > strong::after,
.processing-summary-stat::after {
  content: "•";
  margin: 0 12px;
  color: var(--tomato);
}

.processing-summary-stats {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}

.processing-summary-stat {
  display: inline-flex;
  align-items: baseline;
  white-space: nowrap;
}

.processing-summary-stat:last-child::after {
  content: none;
}

.processing-summary-stat strong {
  margin-right: 5px;
  color: var(--tomato);
  font: 700 13px/1.3 'IBM Plex Mono', monospace;
}

.processing-summary-stat span {
  color: #aaa3ac;
  font-size: 12px;
  line-height: 1.4;
}

.processing-summary-sections {
  width: 100%;
  max-height: 49vh;
  display: grid;
  gap: 10px;
  overflow-y: auto;
  padding-right: 5px;
}

.processing-summary-section {
  width: 100%;
  background: #111113;
  border: 1px solid #353138;
}

.processing-summary-section[open] {
  border-color: #45404a;
}

.processing-summary-section > summary {
  min-height: 66px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 22px;
  align-items: center;
  gap: 12px;
  padding: 17px 21px;
  color: var(--ivory);
  list-style: none;
  cursor: pointer;
  user-select: none;
}

.processing-summary-section > summary::-webkit-details-marker {
  display: none;
}

.processing-summary-section > summary:hover {
  background: rgba(205, 184, 255, .035);
}

.processing-summary-section-title {
  min-width: 0;
  font-size: 15px;
  font-weight: 750;
  line-height: 1.35;
}

.processing-summary-section-count {
  min-width: 29px;
  height: 25px;
  display: inline-grid;
  place-items: center;
  padding: 0 9px;
  color: var(--tomato);
  background: rgba(205, 184, 255, .11);
  border-radius: 999px;
  font: 700 10px/1 'IBM Plex Mono', monospace;
}

.processing-summary-section-chevron {
  color: var(--tomato);
  font: 800 16px/1 'IBM Plex Mono', monospace;
  text-align: center;
  transition: transform .2s ease;
}

.processing-summary-section[open] .processing-summary-section-chevron {
  transform: rotate(180deg);
}

.processing-summary-section-body {
  padding: 0 21px 4px;
  border-top: 1px solid #353138;
}

.processing-summary-item {
  position: relative;
  padding: 15px 0 15px 20px;
  color: #c6c0c8;
  border-bottom: 1px solid #302c32;
  font-size: 12px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.processing-summary-item:last-child {
  border-bottom: 0;
}

.processing-summary-item::before {
  content: "→";
  position: absolute;
  top: 15px;
  left: 0;
  color: var(--tomato);
  font-family: 'IBM Plex Mono', monospace;
}

.processing-summary-merge {
  display: grid;
  grid-template-columns: minmax(0, .95fr) 34px minmax(0, 1.15fr);
  align-items: center;
  gap: 16px;
  padding: 20px 0;
  border-bottom: 1px solid #353138;
}

.processing-summary-merge:last-child {
  border-bottom: 0;
}

.processing-summary-merge-before {
  display: grid;
  gap: 7px;
  color: #9e979f;
  font-size: 12px;
  line-height: 1.45;
}

.processing-summary-merge-arrow {
  color: var(--tomato);
  font: 500 18px/1 'IBM Plex Mono', monospace;
  text-align: center;
}

.processing-summary-merge-after {
  min-width: 0;
}

.processing-summary-merge-product {
  color: var(--ivory);
  font-size: 15px;
  font-weight: 750;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.processing-summary-info {
  width: fit-content;
  max-width: 100%;
  margin-top: 9px;
  padding: 7px 10px;
  color: var(--tomato);
  background: rgba(205, 184, 255, .11);
  border-radius: 999px;
  font: 700 10px/1.35 'IBM Plex Mono', monospace;
  overflow-wrap: anywhere;
}

.processing-summary-empty {
  margin: 0 !important;
  padding: 18px 20px;
  color: var(--ash) !important;
  background: #111113;
  border: 1px solid #353138;
  font-size: 13px !important;
  text-align: center !important;
}

.processing-summary-actions {
  justify-content: center;
  margin-top: 20px;
}

.processing-summary-actions .processing-summary-continue {
  width: auto;
  min-width: 0;
  min-height: 42px;
  padding: 10px 23px;
}

@media (max-width: 680px) {
  .processing-summary-modal {
    padding: 58px 18px 26px;
  }

  .processing-summary-overview {
    align-items: flex-start;
    flex-direction: column;
    padding: 14px 16px;
  }

  .processing-summary-overview > strong::after,
  .processing-summary-stat::after {
    content: none;
  }

  .processing-summary-stats {
    justify-content: flex-start;
    gap: 7px 13px;
  }

  .processing-summary-merge {
    grid-template-columns: 1fr;
    gap: 11px;
  }

  .processing-summary-merge-arrow {
    text-align: left;
    transform: rotate(90deg);
    transform-origin: center;
  }
}

.loader {
  width: 16px;
  height: 16px;
  display: inline-block;
  vertical-align: middle;
  border: 2px solid rgba(255,255,255,.25);
  border-top-color: var(--tomato);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

/* ==========================================================================
   TOUR GUIADO
   ========================================================================== */

body.tour-active {
  overflow: hidden !important;
}

.guided-tour[hidden] {
  display: none !important;
}

.guided-tour {
  position: fixed;
  inset: 0;
  z-index: 30000;
  display: block;
  pointer-events: none;
}

.tour-click-shield {
  position: fixed;
  z-index: 0;
  inset: 0;
  pointer-events: auto;
}

.tour-spotlight {
  position: fixed;
  z-index: 1;
  top: 50%;
  left: 50%;
  width: 120px;
  height: 80px;
  border: 1px solid var(--tomato);
  border-radius: 3px;
  box-shadow:
    0 0 0 9999px rgba(2, 2, 3, .86),
    0 0 0 7px rgba(205, 184, 255, .08),
    0 0 42px rgba(205, 184, 255, .28);
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition:
    top .42s cubic-bezier(.2, .8, .2, 1),
    left .42s cubic-bezier(.2, .8, .2, 1),
    width .42s cubic-bezier(.2, .8, .2, 1),
    height .42s cubic-bezier(.2, .8, .2, 1),
    border-radius .3s ease;
}

.tour-spotlight::before,
.tour-spotlight::after {
  content: "";
  position: absolute;
  background: var(--tomato);
}

.tour-spotlight::before {
  top: -5px;
  left: 18px;
  width: 38px;
  height: 1px;
}

.tour-spotlight::after {
  top: 18px;
  left: -5px;
  width: 1px;
  height: 38px;
}

.tour-card {
  --tour-panel: #09080b;
  --tour-line: rgba(205, 184, 255, .5);
  --tour-muted: #b0a8b5;
  position: fixed;
  z-index: 3;
  width: min(520px, calc(100vw - 32px));
  min-height: 285px;
  overflow: hidden;
  padding: 40px 48px 32px;
  color: var(--ivory);
  background:
    linear-gradient(90deg, rgba(205, 184, 255, .08) 1px, transparent 1px),
    linear-gradient(rgba(205, 184, 255, .08) 1px, transparent 1px),
    var(--tour-panel);
  background-size: 22px 22px;
  border: 1px solid var(--tour-line);
  clip-path: polygon(
    28px 0,
    calc(100% - 68px) 0,
    100% 68px,
    100% calc(100% - 20px),
    calc(100% - 20px) 100%,
    72px 100%,
    0 calc(100% - 72px),
    0 28px
  );
  filter: drop-shadow(0 30px 55px rgba(0, 0, 0, .76));
  outline: 0;
  pointer-events: auto;
  opacity: 0;
  transform: translateY(10px);
  transition:
    top .36s cubic-bezier(.2, .8, .2, 1),
    left .36s cubic-bezier(.2, .8, .2, 1),
    opacity .22s ease,
    transform .22s ease;
}

.tour-card::before {
  content: "SYSTEM / TOUR";
  position: absolute;
  top: 15px;
  right: 26px;
  color: rgba(205, 184, 255, .5);
  font: 700 7px/1 'IBM Plex Mono', monospace;
  letter-spacing: .14em;
  pointer-events: none;
}

.tour-card::after {
  content: "";
  position: absolute;
  top: 0;
  left: 48px;
  width: 150px;
  height: 1px;
  background: var(--tomato);
  box-shadow: 0 0 16px rgba(205, 184, 255, .34);
  pointer-events: none;
}

.guided-tour.is-ready .tour-card {
  opacity: 1;
  transform: translateY(0);
}

.tour-pointer {
  display: none;
}

.tour-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding-right: 0;
}

.tour-kicker {
  color: var(--tomato);
  font: 700 9px/1 'IBM Plex Mono', monospace;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.tour-close {
  width: 34px;
  height: 34px;
  display: grid;
  flex: 0 0 34px;
  padding: 0;
  place-items: center;
  color: var(--ash);
  background: transparent;
  border: 1px solid rgba(205, 184, 255, .34);
  border-radius: 50%;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, transform .2s ease;
}

.tour-close:hover {
  color: var(--noir);
  background: var(--tomato);
  transform: rotate(90deg);
}

.tour-progress {
  position: relative;
  height: 2px;
  margin: 22px 0 24px;
  overflow: hidden;
  background: rgba(205, 184, 255, .16);
}

.tour-progress span {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: var(--tomato);
  box-shadow: 0 0 12px rgba(205, 184, 255, .34);
  transition: width .35s ease;
}

.tour-card h2 {
  margin: 0;
  color: var(--ivory);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 27px;
  font-weight: 500;
  line-height: 1.13;
  letter-spacing: -.045em;
  text-transform: uppercase;
}

.tour-card-copy {
  min-height: 70px;
  margin: 17px 0 0;
  color: var(--tour-muted);
  font-size: 13px;
  line-height: 1.68;
}

.tour-card-copy strong {
  color: var(--ivory);
}

.tour-actions {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px;
  align-items: center;
  margin-top: 28px;
}

.tour-actions button {
  min-height: 42px;
  padding: 0 14px;
  color: var(--ivory);
  background: transparent;
  border: 1px solid rgba(205, 184, 255, .24);
  clip-path: polygon(
    7px 0,
    100% 0,
    100% calc(100% - 7px),
    calc(100% - 7px) 100%,
    0 100%,
    0 7px
  );
  font: 600 8px/1 'IBM Plex Mono', monospace;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, border-color .18s ease;
}

.tour-actions button:hover:not(:disabled) {
  color: var(--noir);
  background: var(--tomato);
  border-color: var(--tomato);
}

.tour-actions button:disabled {
  opacity: .28;
  cursor: default;
}

.tour-actions .tour-skip {
  justify-self: center;
  padding-inline: 8px;
  color: #77707d;
  border-color: transparent;
}

.tour-actions .tour-next {
  min-width: 116px;
  color: var(--noir);
  background: var(--tomato);
  border-color: var(--tomato);
}

}

@keyframes pulse {

  50% { opacity: .35; }

@keyframes modal-in {

  to { opacity: 1; transform: translateY(0); }
